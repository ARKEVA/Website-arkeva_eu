<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#2a3242;
    --txt:#e6edf3; --muted:#8b97a7; --accent:#3fb6ff; --accent2:#1f6feb;
    --ok:#3fb950; --warn:#d29922; --crit:#f85149; --purple:#bc8cff;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;line-height:1.5}
  a{color:var(--accent);text-decoration:none}
  .app{display:flex;min-height:100vh}
  /* Sidebar */
  .side{width:240px;background:#0a0e14;border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column}
  .logo{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
  .logo .mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px}
  .logo b{font-size:16px;letter-spacing:.3px}
  .logo small{display:block;color:var(--muted);font-size:11px;font-weight:400}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
  .nav button{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--muted);padding:10px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;text-align:left;width:100%;font-family:var(--font)}
  .nav button .ic{width:18px;text-align:center;font-size:15px}
  .nav button:hover{background:var(--panel);color:var(--txt)}
  .nav button.active{background:var(--accent2);color:#fff}
  .side .foot{margin-top:auto;font-size:11px;color:var(--muted);padding:10px 8px;border-top:1px solid var(--border)}
  .pill{display:inline-flex;align-items:center;gap:6px;background:#0f2417;border:1px solid #1c4029;color:var(--ok);padding:3px 8px;border-radius:20px;font-size:11px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
  /* Main */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:rgba(13,17,23,.6);backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
  .topbar h1{font-size:17px;margin:0}
  .topbar .sub{color:var(--muted);font-size:12px}
  .content{padding:22px 24px;max-width:1180px;width:100%}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .card h3{margin:0 0 4px;font-size:14px}
  .card .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .kpi{font-size:26px;font-weight:700;margin-top:6px}
  .kpi small{font-size:13px;font-weight:500;color:var(--muted)}
  .trend-up{color:var(--crit)} .trend-dn{color:var(--ok)}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
  .b-ok{background:#0f2417;color:var(--ok)} .b-warn{background:#2b2210;color:var(--warn)} .b-crit{background:#2d1212;color:var(--crit)} .b-info{background:#10243a;color:var(--accent)}
  canvas{display:block;width:100%}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
  tr:hover td{background:var(--panel2)}
  .btn{background:var(--accent2);color:#fff;border:none;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:var(--font)}

  .step{display:flex;gap:12px;margin-bottom:14px}
  .step .num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--accent2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}

  .inputrow{display:flex;gap:8px}
  .inputrow input,textarea,select{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--txt);padding:10px 12px;border-radius:8px;font-family:var(--font);font-size:13.5px}
  textarea{width:100%;resize:vertical;min-height:90px}
  .alertbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;margin-bottom:16px;border:1px solid}

  .alertbar.warn{background:#2b2210;border-color:#574411;color:#ffd98a}
  .muted{color:var(--muted)}
  .mono{font-family:var(--mono)}
  .twin{position:relative;background:var(--panel2);border:1px solid var(--border);border-radius:12px;height:360px;overflow:hidden}
  .node{position:absolute;width:78px;height:48px;border-radius:8px;border:2px solid var(--border);background:#0e1420;display:grid;place-items:center;font-size:11px;text-align:center;cursor:pointer;transition:.2s;line-height:1.2}
  .node:hover{border-color:var(--accent)}
  .node.ok{border-color:#1c4029} .node.warn{border-color:#574411;box-shadow:0 0 14px rgba(210,153,34,.4)} .node.crit{border-color:#5c1f1f;box-shadow:0 0 16px rgba(248,81,73,.5);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(248,81,73,.4)}50%{box-shadow:0 0 22px rgba(248,81,73,.8)}}
  .node .st{position:absolute;top:-7px;right:-7px;width:14px;height:14px;border-radius:50%;border:2px solid var(--panel2)}
  .node .st.ok{background:var(--ok)} .node .st.warn{background:var(--warn)} .node .st.crit{background:var(--crit)}
  svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  .tabs button{background:none;border:none;color:var(--muted);padding:8px 14px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent;font-family:var(--font)}

  .scn{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--panel2)}
  .scn .lvl{font-size:11px;padding:2px 8px;border-radius:5px}
  .progress{height:7px;background:var(--border);border-radius:4px;overflow:hidden}
  .progress>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--ok))}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block}
  .hidden{display:none}
  .typing{display:inline-block}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--panel);border:1px solid var(--ok);color:var(--txt);padding:14px 18px;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);z-index:50;max-width:320px}
  .fieldlabel{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:12px 0 4px;display:block}
  code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:12px}
</style>

<script>
/* ============================ ÉTAT & DONNÉES SIMULÉES ============================ */
const STATE = {
  view:'dash',
  // équipements de l'atelier (ligne d'assemblage manufacturière)
  assets:[
    {id:'MOT-04', name:'Motoréducteur convoyeur', status:'crit', x:300,y:60},
    {id:'PMP-02', name:'Pompe hydraulique', status:'ok', x:90,y:60},
    {id:'CMP-01', name:'Compresseur air', status:'warn', x:520,y:60},
    {id:'ROB-07', name:'Robot soudure', status:'ok', x:300,y:230},
    {id:'CNV-03', name:'Convoyeur principal', status:'warn', x:90,y:230},
    {id:'ARM-05', name:'Armoire électrique', status:'ok', x:520,y:230},
  ],
  // signaux temps réel du MOT-04 (motoréducteur en défaut)
  signals:{
    vibration:{label:'Vibration RMS', unit:'mm/s', base:2.4, color:'#f85149', warn:4.5, crit:7.1, data:[]},
    temperature:{label:'Température paliers', unit:'°C', base:58, color:'#d29922', warn:75, crit:90, data:[]},
    courant:{label:'Courant moteur', unit:'A', base:11.5, color:'#3fb6ff', warn:14, crit:16, data:[]},
    pression:{label:'Pression huile', unit:'bar', base:3.2, color:'#3fb950', warn:2.2, crit:1.6, data:[], invert:true},
  },
  detected:false,
  reportSteps:[],
};

// Génère une fenêtre historique avec une dérive progressive (signature de défaillance)
function seedSignals(){
  const N=60;
  for(const k in STATE.signals){
    const s=STATE.signals[k]; s.data=[];
    for(let i=0;i<N;i++){
      let drift=0;
      // dérive sur les 20 derniers points pour vibration & température (roulement dégradé)
      if((k==='vibration'||k==='temperature') && i>40) drift=(i-40)*( k==='vibration'?0.22:0.95);
      const noise=(Math.random()-0.5)*(s.base*0.06);
      let v=s.base+drift+noise;
      if(k==='pression' && i>40) v=s.base-(i-40)*0.05; // chute pression huile
      s.data.push(Math.max(0,+v.toFixed(2)));
    }
  }
}
seedSignals();

/* ============================ CHART CANVAS (vanilla, offline) ============================ */
function lineChart(canvas, series, opts={}){
  const dpr=window.devicePixelRatio||1;
  const W=canvas.clientWidth, H=opts.h||180;
  canvas.width=W*dpr; canvas.height=H*dpr; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const pad={l:38,r:10,t:12,b:20};
  const allvals=series.flatMap(s=>s.data);
  let min=Math.min(...allvals), max=Math.max(...allvals);
  if(opts.min!=null)min=opts.min; if(opts.max!=null)max=opts.max;
  const rng=(max-min)||1; min-=rng*0.1; max+=rng*0.1;
  const px=i=>pad.l+(i/(series[0].data.length-1))*(W-pad.l-pad.r);
  const py=v=>pad.t+(1-(v-min)/(max-min))*(H-pad.t-pad.b);
  // grid
  ctx.strokeStyle='#2a3242'; ctx.lineWidth=1; ctx.fillStyle='#8b97a7'; ctx.font='10px monospace';
  for(let g=0;g<=3;g++){
    const y=pad.t+g/3*(H-pad.t-pad.b); ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillText((max-(g/3)*(max-min)).toFixed(1),4,y+3);
  }
  // threshold lines
  if(opts.warn!=null){ctx.strokeStyle='#574411';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(pad.l,py(opts.warn));ctx.lineTo(W-pad.r,py(opts.warn));ctx.stroke();}
  if(opts.crit!=null){ctx.strokeStyle='#5c1f1f';ctx.beginPath();ctx.moveTo(pad.l,py(opts.crit));ctx.lineTo(W-pad.r,py(opts.crit));ctx.stroke();}
  ctx.setLineDash([]);
  // series
  series.forEach(s=>{
    ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.beginPath();
    s.data.forEach((v,i)=>{i?ctx.lineTo(px(i),py(v)):ctx.moveTo(px(i),py(v));});
    ctx.stroke();
    // fill
    if(opts.fill){ctx.lineTo(px(s.data.length-1),H-pad.b);ctx.lineTo(px(0),H-pad.b);ctx.closePath();
      ctx.fillStyle=s.color+'18';ctx.fill();}
  });
}

/* ============================ NAVIGATION ============================ */
const TITLES={dash:['Tableau de bord',"Vue d'ensemble de l'atelier — Ligne d'assemblage 3"],
  detect:['Détection temps réel','Analyse des signaux capteurs & reconnaissance de patterns'],
  diag:['Diagnostic & sources','Corrélation multi-bases & aide à la résolution'],
  report:['Rapport de panne','Génération automatique du rapport pour la GMAO'],
  train:['Formation','Entraînement sur scénarios de panne'],
  twin:['Jumeau numérique','Représentation virtuelle de la ligne en temps réel']};

document.getElementById('nav').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  STATE.view=b.dataset.v;
  [...document.querySelectorAll('#nav button')].forEach(x=>x.classList.toggle('active',x===b));
  document.getElementById('vtitle').textContent=TITLES[STATE.view][0];
  document.getElementById('vsub').textContent=TITLES[STATE.view][1];
  render();
});

function toast(msg){const t=document.getElementById('toast');t.innerHTML=`<div class="toast">✓ ${msg}</div>`;setTimeout(()=>t.innerHTML='',3500);}

/* ============================ RENDU DES VUES ============================ */
function render(){
  /* annule l'animation du jumeau si on quitte la vue */
  if(_tRaf){cancelAnimationFrame(_tRaf);_tRaf=null;}
  const c=document.getElementById('content');
  c.innerHTML=({dash:viewDash,detect:viewDetect,diag:viewDiag,report:viewReport,train:viewTrain,twin:viewTwin}[STATE.view])();
  if(STATE.view==='dash')drawDash();
  if(STATE.view==='detect')drawDetect();
  if(STATE.view==='twin')drawTwin();
}

    <div class="card"><div class="lbl">Patterns en base</div><div class="kpi">1 284</div><span class="muted" style="font-size:12px">347 rapports liés</span></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card">
      <h3>Vibration RMS — MOT-04</h3><div class="muted" style="font-size:12px;margin-bottom:8px">Dérive nette sur la dernière heure</div>
      <canvas id="dashChart1"></canvas>
      <div class="legend" style="margin-top:8px"><span><span class="swatch" style="background:#f85149"></span>Vibration mm/s</span><span><span class="swatch" style="background:#574411"></span>Seuil alerte</span><span><span class="swatch" style="background:#5c1f1f"></span>Seuil critique</span></div>
    </div>
    <div class="card">
      <h3>État de la ligne d'assemblage 3</h3><div class="muted" style="font-size:12px;margin-bottom:8px">Synthèse temps réel des équipements</div>
      <table><thead><tr><th>Équipement</th><th>État</th><th>Indicateur clé</th></tr></thead><tbody>
      ${STATE.assets.map(a=>`<tr><td><b>${a.id}</b><br><span class="muted" style="font-size:12px">${a.name}</span></td>
        <td><span class="badge ${a.status==='ok'?'b-ok':a.status==='warn'?'b-warn':'b-crit'}">${a.status==='ok'?'Nominal':a.status==='warn'?'À surveiller':'Critique'}</span></td>
        <td class="mono">${a.id==='MOT-04'?'7.1 mm/s ▲':a.id==='CMP-01'?'Débit -12%':a.id==='CNV-03'?'Jeu chaîne':'—'}</td></tr>`).join('')}
      </tbody></table>
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <h3>Activité récente de l'assistant</h3>
    <table><tbody>
      <tr><td class="muted mono" style="width:120px">09:42</td><td>Détection pattern « dégradation roulement » sur MOT-04</td><td><span class="badge b-crit">auto</span></td></tr>
      <tr><td class="muted mono">08:15</td><td>Rapport #2026-0312 validé et poussé en GMAO (CMP-01)</td><td><span class="badge b-ok">clôturé</span></td></tr>
      <tr><td class="muted mono">Hier</td><td>Formation « Diagnostic surchauffe palier » complétée — opérateur M. Diallo</td><td><span class="badge b-info">formation</span></td></tr>
    </tbody></table>
  </div>`;
}
function drawDash(){lineChart(document.getElementById('dashChart1'),[STATE.signals.vibration],{warn:4.5,crit:7.1,fill:true,h:190});}
function goDiag(){document.querySelector('#nav button[data-v="diag"]').click();}

/* ---------- DÉTECTION TEMPS RÉEL ---------- */
function viewDetect(){
  const s=STATE.signals;
  return `
  <div class="grid g4">
    ${Object.entries(s).map(([k,v])=>{

function tickLive(){

  for(const k in STATE.signals){const s=STATE.signals[k];s.data.shift();
    const prev=s.data[s.data.length-1];const noise=(Math.random()-0.5)*(s.base*0.05);

    s.data.push(+Math.max(0,v).toFixed(2));}

/* ── helper : roundRect polyfill ── */
function rrect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

/* ── Génère un signal pseudo-aléatoire pour sparklines ── */
function _fakeSignal(base,len=60,drift=0,noise=.06){
  const d=[];for(let i=0;i<len;i++){
    const dr=i>40?drift*(i-40):0;
    d.push(Math.max(0,+(base+dr+(Math.random()-.5)*base*noise).toFixed(2)));
  }return d;
}

/* ── Rendu canvas ── */
function drawTwin(){
  if(_tRaf){cancelAnimationFrame(_tRaf);_tRaf=null;}
  const cv=document.getElementById('twinCanvas');
  if(!cv)return;

  const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth||660, H=cv.clientHeight||360;
  cv.width=W*dpr; cv.height=H*dpr;
  cv.style.height=H+'px';
  const ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);

  /* ── P&ID layout (positions normalisées 0-1) ── */
  const PID_EQ={
    'PMP-02':{nx:.095,ny:.285,type:'pump'},
    'MOT-04':{nx:.360,ny:.285,type:'motor'},
    'CMP-01':{nx:.720,ny:.215,type:'compressor'},
    'CNV-03':{nx:.095,ny:.720,type:'conveyor'},
    'ARM-05':{nx:.480,ny:.720,type:'cabinet'},
    'ROB-07':{nx:.830,ny:.720,type:'robot'},
  };

  /* Tuyauteries : tableaux de waypoints normalisés + statut */
  const PID_PIPES=[
    {pts:[[.095,.285],[.360,.285]],         st:'crit', id:0},
    {pts:[[.360,.285],[.360,.215],[.720,.215]], st:'warn', id:1},
    {pts:[[.360,.285],[.360,.500],[.480,.500],[.480,.720]], st:'warn', id:2},
    {pts:[[.095,.720],[.480,.720]],         st:'warn', id:3},
    {pts:[[.480,.720],[.830,.720]],         st:'ok',   id:4},
    {pts:[[.720,.215],[.830,.215],[.830,.720]], st:'ok', id:5},
  ];

  /* Vannes (position normalisée, type) */
  const PID_VALVES=[
    {nx:.225,ny:.285,type:'gate'},
    {nx:.530,ny:.215,type:'control'},
    {nx:.360,ny:.400,type:'gate'},
    {nx:.285,ny:.720,type:'gate'},
    {nx:.655,ny:.720,type:'control'},
    {nx:.830,ny:.470,type:'gate'},
  ];

  /* Tags instruments (position normalisée, code, couleur) */
  const PID_INSTR=[
    {nx:.165,ny:.215,tag:'FT',num:'101',col:'#3fb6ff'},
    {nx:.310,ny:.215,tag:'VT',num:'401',col:'#f85149'},  // vibration critique
    {nx:.415,ny:.215,tag:'TT',num:'301',col:'#d29922'},  // temp. warning
    {nx:.780,ny:.140,tag:'PT',num:'201',col:'#d29922'},  // pression CMP
    {nx:.175,ny:.790,tag:'FT',num:'501',col:'#d29922'},  // flux CNV warn
    {nx:.620,ny:.790,tag:'PT',num:'601',col:'#3fb950'},  // pression ARM ok
  ];

  /* ── Palettes P&ID ── */
  const PIPE_C ={ok:'#1e4d30',warn:'#4a3a10',crit:'#4a1a1a'};
  const FLOW_C ={ok:'#3fb950',warn:'#d29922',crit:'#f85149'};
  const BADGE_C={ok:{fill:'#1d5c34',txt:'#6ee89a',lbl:'High Confidence'},
                 warn:{fill:'#5c3d10',txt:'#ffd068',lbl:'Medium Confidence'},
                 crit:{fill:'#5c1c1c',txt:'#ff9090',lbl:'Low Confidence'}};

  /* ── Utilitaire : longueur totale d'un chemin multi-segment ── */
  function pathLen(pts){
    let l=0;
    for(let i=1;i<pts.length;i++){
      const dx=(pts[i][0]-pts[i-1][0])*W, dy=(pts[i][1]-pts[i-1][1])*H;
      l+=Math.sqrt(dx*dx+dy*dy);
    }
    return l;
  }

  /* ── Utilitaire : point à l'abscisse curviligne t (0-1) ── */
  function ptOnPath(pts,t){
    const total=pathLen(pts);
    let target=t*total, acc=0;
    for(let i=1;i<pts.length;i++){
      const dx=(pts[i][0]-pts[i-1][0])*W, dy=(pts[i][1]-pts[i-1][1])*H;
      const seg=Math.sqrt(dx*dx+dy*dy);
      if(acc+seg>=target){
        const f=(target-acc)/seg;
        return [pts[i-1][0]*W+dx*f, pts[i-1][1]*H+dy*f];
      }
      acc+=seg;
    }
    return [pts[pts.length-1][0]*W, pts[pts.length-1][1]*H];
  }

  /* ── Symbole vanne ── */
  function drawValve(vx,vy,type){
    const s=7;
    ctx.fillStyle='#061220'; ctx.strokeStyle='#4a90c8'; ctx.lineWidth=1.4;
    if(type==='gate'){
      // bow-tie (gate valve standard P&ID)
      ctx.beginPath();
      ctx.moveTo(vx-s,vy-s); ctx.lineTo(vx+s,vy+s);
      ctx.lineTo(vx+s,vy-s); ctx.lineTo(vx-s,vy+s);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      // control valve : triangle + cercle actionneur
      ctx.beginPath();
      ctx.moveTo(vx-s,vy-s); ctx.lineTo(vx+s,vy-s); ctx.lineTo(vx,vy+s);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(vx,vy-s-5,4,0,Math.PI*2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(vx,vy-s); ctx.lineTo(vx,vy-s-6); ctx.stroke();
    }
  }

  /* ── Symbole équipement P&ID ── */
  function drawEquip(cx,cy,type,status,id,name,isSel){
    const sc=FLOW_C[status]||'#4a90c8';
    const pulse=status==='crit'?(.35+.65*Math.abs(Math.sin(_tPhase*Math.PI*5))):1;

    /* halo sélection */
    if(isSel){
      ctx.strokeStyle='rgba(255,255,255,.22)';
      ctx.lineWidth=6; ctx.setLineDash([]);
      ctx.beginPath();ctx.arc(cx,cy,26,0,Math.PI*2);ctx.stroke();
    }
    /* halo statut pulsant */
    if(status!=='ok'){
      ctx.strokeStyle=sc.replace(')',`,${pulse*.5})`).replace('rgb','rgba');
      ctx.lineWidth=1.5; ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.arc(cx,cy,24,0,Math.PI*2);ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.fillStyle='#061220';
    ctx.strokeStyle=isSel?'#ffffff':sc;
    ctx.lineWidth=isSel?2:1.6;

    switch(type){
      case 'pump':
        // Cercle centrifuge
        ctx.beginPath();ctx.arc(cx,cy,18,0,Math.PI*2);ctx.fill();ctx.stroke();
        // Impulseur (ligne de refoulement 45°)
        ctx.strokeStyle=sc+'bb';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+12,cy-12);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+12,cy+4);ctx.stroke();
        // Stub entrée gauche
        ctx.strokeStyle='#2a5a82';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx-18,cy);ctx.lineTo(cx-28,cy);ctx.stroke();
        break;

      case 'motor':
        // Cercle moteur
        ctx.beginPath();ctx.arc(cx,cy,18,0,Math.PI*2);ctx.fill();ctx.stroke();
        // Lettre M en sc
        ctx.fillStyle=sc; ctx.font=`700 13px sans-serif`; ctx.textAlign='center';
        ctx.fillText('M',cx,cy+5); ctx.textAlign='left';
        // Stubs
        ctx.strokeStyle='#2a5a82';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx-18,cy);ctx.lineTo(cx-28,cy);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx+18,cy);ctx.lineTo(cx+28,cy);ctx.stroke();
        break;

      case 'compressor':
        // Cercle compresseur
        ctx.beginPath();ctx.arc(cx,cy,18,0,Math.PI*2);ctx.fill();ctx.stroke();
        // Triangle intérieur (sens refoulement)
        ctx.fillStyle=sc+'55';ctx.strokeStyle=sc;ctx.lineWidth=1.2;
        ctx.beginPath();
        ctx.moveTo(cx-8,cy+7);ctx.lineTo(cx+11,cy);ctx.lineTo(cx-8,cy-7);
        ctx.closePath();ctx.fill();ctx.stroke();
        // Stubs
        ctx.strokeStyle='#2a5a82';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx-18,cy);ctx.lineTo(cx-28,cy);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx+18,cy);ctx.lineTo(cx+28,cy);ctx.stroke();
        break;

      case 'conveyor':
        // Rectangle allongé avec rouleaux
        ctx.fillStyle='#061220';ctx.strokeStyle=isSel?'#fff':sc;ctx.lineWidth=1.6;
        rrect(ctx,cx-22,cy-11,44,22,5);ctx.fill();ctx.stroke();
        ctx.strokeStyle=sc+'66';ctx.lineWidth=1;
        [-12,-4,4,12].forEach(dx=>{
          ctx.beginPath();ctx.moveTo(cx+dx,cy-9);ctx.lineTo(cx+dx,cy+9);ctx.stroke();
        });
        // Stubs
        ctx.strokeStyle='#2a5a82';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(cx-22,cy);ctx.lineTo(cx-32,cy);ctx.stroke();
        ctx.beginPath();ctx.moveTo(cx+22,cy);ctx.lineTo(cx+32,cy);ctx.stroke();
        break;

      case 'cabinet':
        // Carré armoire électrique
        ctx.fillStyle='#061220';ctx.strokeStyle=isSel?'#fff':sc;ctx.lineWidth=1.6;
        rrect(ctx,cx-16,cy-16,32,32,4);ctx.fill();ctx.stroke();
        // Éclair intérieur
        ctx.strokeStyle=sc;ctx.lineWidth=1.4;ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(cx+3,cy-9);ctx.lineTo(cx-3,cy);ctx.lineTo(cx+3,cy);ctx.lineTo(cx-3,cy+9);
        ctx.stroke();ctx.lineCap='butt';
        break;

      case 'robot':
        // Carré robot
        ctx.fillStyle='#061220';ctx.strokeStyle=isSel?'#fff':sc;ctx.lineWidth=1.6;
        rrect(ctx,cx-16,cy-16,32,32,4);ctx.fill();ctx.stroke();
        // Bras articulé simplifié
        ctx.strokeStyle=sc;ctx.lineWidth=2;ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(cx-4,cy+9);ctx.lineTo(cx-1,cy+1);
        ctx.lineTo(cx+7,cy-4);ctx.lineTo(cx+12,cy-11);
        ctx.stroke();
        ctx.beginPath();ctx.arc(cx-1,cy+1,2.5,0,Math.PI*2);
        ctx.fillStyle=sc;ctx.fill();
        ctx.fillStyle='#061220';ctx.lineCap='butt';
        break;
    }

    /* Badge statut (carré coloré en haut à droite — style P&ID référence) */
    const b=BADGE_C[status]||{fill:'#333',txt:'#888',lbl:'N/A'};
    const bw=70, bh=14, bx=cx+12, by=cy-36;
    rrect(ctx,bx,by,bw,bh,3);
    ctx.fillStyle=b.fill;ctx.fill();
    ctx.strokeStyle=b.txt+'66';ctx.lineWidth=.8;ctx.stroke();
    ctx.fillStyle=b.txt;ctx.font=`600 8px -apple-system,sans-serif`;
    ctx.textAlign='left';
    ctx.fillText(b.lbl,bx+5,by+10);

    /* Tag équipement sous le symbole */
    ctx.fillStyle=isSel?'#ffffff':'#a8c4dc';
    ctx.font=`700 11px 'SFMono-Regular',Consolas,monospace`;
    ctx.textAlign='center';
    ctx.fillText(id,cx,cy+33);
    const sn=name.split(' ').slice(0,2).join(' ');
    ctx.fillStyle='rgba(120,150,175,.65)';
    ctx.font=`400 9px -apple-system,sans-serif`;
    ctx.fillText(sn,cx,cy+44);
    ctx.textAlign='left';
  }

  /* ── click handler ── */
  cv.onclick=e=>{
    const r=cv.getBoundingClientRect();
    const mx=(e.clientX-r.left)*(W/r.width);
    const my=(e.clientY-r.top)*(H/r.height);
    for(const a of STATE.assets){
      const m=PID_EQ[a.id];if(!m)continue;
      if(Math.hypot(mx-m.nx*W,my-m.ny*H)<26){window._tSel=a.id;return;}
    }
  };

  /* ══ Boucle d'animation ══ */
  function frame(){
    if(STATE.view!=='twin'){_tRaf=null;return;}
    _tPhase=(_tPhase+.006)%1;
    ctx.clearRect(0,0,W,H);

    /* Fond blueprint */
    ctx.fillStyle='#060e1a';ctx.fillRect(0,0,W,H);

    /* Grille de points fine */
    ctx.fillStyle='rgba(30,60,90,.5)';
    const gs=22;
    for(let x=gs;x<W;x+=gs)for(let y=gs;y<H;y+=gs){
      ctx.beginPath();ctx.arc(x,y,.9,0,Math.PI*2);ctx.fill();
    }

    /* Zone labels (légers, en fond) */
    const ZONE_LABELS=[
      {text:'Alimentation hydraulique',  x:.010,y:.055},
      {text:'Motorisation / Drive',       x:.295,y:.055},
      {text:'Air comprimé',               x:.625,y:.055},
      {text:'Convoyage',                  x:.010,y:.840},
      {text:'Distribution / Armoire',     x:.360,y:.840},
      {text:'Assemblage robotique',       x:.695,y:.840},
    ];
    ctx.fillStyle='rgba(70,110,150,.35)';
    ctx.font=`400 9px -apple-system,sans-serif`;
    for(const z of ZONE_LABELS) ctx.fillText(z.text,z.x*W,z.y*H);

    /* ── Tuyauteries ── */
    for(const p of PID_PIPES){
      // Ligne de tuyau
      ctx.strokeStyle=PIPE_C[p.st]||'#1e3555';
      ctx.lineWidth=2.2; ctx.setLineDash([]);
      ctx.beginPath();
      p.pts.forEach(([nx,ny],i)=>i?ctx.lineTo(nx*W,ny*H):ctx.moveTo(nx*W,ny*H));
      ctx.stroke();

      // Petite flèche de sens au milieu
      const mid=ptOnPath(p.pts,.48);
      const nxt=ptOnPath(p.pts,.52);
      const ang=Math.atan2(nxt[1]-mid[1],nxt[0]-mid[0]);
      ctx.strokeStyle=FLOW_C[p.st];ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.moveTo(mid[0]-Math.cos(ang-0.4)*5,mid[1]-Math.sin(ang-0.4)*5);
      ctx.lineTo(mid[0]+Math.cos(ang)*5,mid[1]+Math.sin(ang)*5);
      ctx.lineTo(mid[0]-Math.cos(ang+0.4)*5,mid[1]-Math.sin(ang+0.4)*5);
      ctx.stroke();

      // Particule animée
      const offset=(p.id*.19)%1;
      const pt=ptOnPath(p.pts,((_tPhase+offset)%1));
      ctx.beginPath();ctx.arc(pt[0],pt[1],3.8,0,Math.PI*2);
      ctx.fillStyle=FLOW_C[p.st];ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=.8;ctx.stroke();
    }

    /* ── Vannes ── */
    for(const v of PID_VALVES) drawValve(v.nx*W,v.ny*H,v.type);

    /* ── Tags instruments ── */
    for(const ins of PID_INSTR){
      const ix=ins.nx*W, iy=ins.ny*H, r=12;
      // Ligne de connexion vers le tuyau le plus proche
      ctx.strokeStyle=ins.col+'44';ctx.lineWidth=1;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(ix,iy+r);ctx.lineTo(ix,iy+r+10);ctx.stroke();
      ctx.setLineDash([]);
      // Cercle tag
      ctx.fillStyle='#07101e';
      ctx.strokeStyle=ins.col;ctx.lineWidth=1.3;
      ctx.beginPath();ctx.arc(ix,iy,r,0,Math.PI*2);ctx.fill();ctx.stroke();
      // Texte
      ctx.fillStyle=ins.col;
      ctx.font=`700 7.5px -apple-system,sans-serif`; ctx.textAlign='center';
      ctx.fillText(ins.tag,ix,iy-1);
      ctx.font=`400 6.5px -apple-system,sans-serif`;
      ctx.fillStyle='rgba(255,255,255,.4)';
      ctx.fillText(ins.num,ix,iy+8);
      ctx.textAlign='left';
    }

    /* ── Équipements P&ID ── */
    for(const a of STATE.assets){
      const m=PID_EQ[a.id];if(!m)continue;
      drawEquip(m.nx*W,m.ny*H,m.type,a.status,a.id,a.name,a.id===window._tSel);
    }

    /* ── Légende (coin bas-gauche) ── */
    const lx=12, ly=H-52;
    [[BADGE_C.ok,'ok'],[BADGE_C.warn,'warn'],[BADGE_C.crit,'crit']].forEach(([b,_st],i)=>{
      rrect(ctx,lx,ly+i*17,64,12,2);
      ctx.fillStyle=b.fill;ctx.fill();
      ctx.strokeStyle=b.txt+'55';ctx.lineWidth=.7;ctx.stroke();
      ctx.fillStyle=b.txt;ctx.font=`600 7.5px -apple-system,sans-serif`;
      ctx.fillText(b.lbl,lx+5,ly+i*17+9);
    });

    _updateDetail();
    _tRaf=requestAnimationFrame(frame);
  }
  frame();
  _updateDetail();
}

  function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
  var subKeys = Object.keys(SUB).sort(function(a,b){return b.length-a.length;});
  var subRe = subKeys.length ? new RegExp(subKeys.map(esc).join('|'),'g') : null;
  function tr(s){
    var k=s.trim(), t=s;
    if(EXACT[k]!=null) t=s.replace(k,EXACT[k]);
    else if(subRe) t=s.replace(subRe,function(m){return SUB[m];});
    return t;
  }
  var ORIG = new WeakMap();
  function applyTr(root){
    if(!root) return;
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),n,arr=[];
    while(n=w.nextNode()){
      var pn=n.parentNode&&n.parentNode.nodeName;
      if(pn==='SCRIPT'||pn==='STYLE'||pn==='NOSCRIPT') continue;
      arr.push(n);
    }
    arr.forEach(function(node){
      if(!ORIG.has(node)) ORIG.set(node,node.nodeValue);
      var o=ORIG.get(node);
      node.nodeValue = (window.__LANG==='en') ? tr(o) : o;
    });
    root.querySelectorAll&&root.querySelectorAll('[placeholder]').forEach(function(el){
      if(el.__op==null) el.__op=el.getAttribute('placeholder');
      el.setAttribute('placeholder', window.__LANG==='en'?tr(el.__op):el.__op);
    });
    root.querySelectorAll&&root.querySelectorAll('input').forEach(function(el){
      if(!el.hasAttribute('value')&&el.__ov==null) return;
      if(el.__ov==null) el.__ov=el.getAttribute('value')||'';
      var nv=window.__LANG==='en'?tr(el.__ov):el.__ov; el.setAttribute('value',nv); el.value=nv;
    });
    root.querySelectorAll&&root.querySelectorAll('textarea').forEach(function(el){
      if(el.__ot==null) el.__ot=el.textContent;
      el.value = window.__LANG==='en'?tr(el.__ot):el.__ot;
    });
  }
  window.__applyTr = applyTr;

  /* enrobe les fonctions qui produisent du DOM (le FR d'origine est conservé tel quel) */
  var _r=window.render; window.render=function(){_r.apply(this,arguments); applyTr(document.getElementById('content')); applyTr(document.querySelector('.topbar'));};
  var _pm=window.pushMsg; window.pushMsg=function(){_pm.apply(this,arguments); applyTr(document.getElementById('chat'));};
  var _to=window.toast; window.toast=function(){_to.apply(this,arguments); applyTr(document.getElementById('toast'));};
  var _ss=window.startScenario; window.startScenario=function(){_ss.apply(this,arguments); applyTr(document.getElementById('scnRun'));};
  var _sa=window.scnAnswer; window.scnAnswer=function(){_sa.apply(this,arguments); applyTr(document.getElementById('scnFb'));};
  var _ud=window._updateDetail; window._updateDetail=function(){_ud.apply(this,arguments); applyTr(document.getElementById('twinDetailP'));};
  var _tw=window.twinMode; window.twinMode=function(){_tw.apply(this,arguments); applyTr(document.getElementById('content'));};

  /* synchro avec le sélecteur FR/EN du site (même origine → événement storage) */
  window.addEventListener('storage', function(e){
    if(e.key==='arkeva-lang'){ window.__LANG=e.newValue||'fr'; document.documentElement.lang=window.__LANG; applyTr(document.body); }
  });
})();

render();
window.__applyTr(document.body);
